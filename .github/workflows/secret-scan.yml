#
# secret-scan — gitleaks secret-scanning gate (ADR-0072 Phase 4, Sub-Item 4f).
#
# What this workflow does
# -----------------------
#   1. Downloads the gitleaks release tarball for a PINNED version and
#      verifies its SHA-256 against the value pinned below (copied from the
#      release's `gitleaks_<ver>_checksums.txt`). No `gitleaks-action`
#      (organisation accounts need a licence key for the action; the CLI
#      binary is MIT and licence-free), no third-party action, no network
#      egress beyond the single GitHub release download.
#   2. Runs `gitleaks git` over the FULL history (fetch-depth: 0) using the
#      repo-local `.gitleaks.toml` (default rules + reviewed allowlist).
#   3. Output is redacted and count-only; the job fails on any finding.
#      Reproduce locally with the same command to see file/line details —
#      finding locations are deliberately not printed into public CI logs.
#
# Deployed identically to wakir-runtime, wakir-protocol and wakir-verify.
# The job display name `secret-scan` is the branch-protection
# required-status-check name — do not rename without updating protection.
#
# Upgrade procedure: bump GITLEAKS_VERSION, fetch
#   https://github.com/gitleaks/gitleaks/releases/download/v<ver>/gitleaks_<ver>_checksums.txt
# and copy the `linux_x64.tar.gz` line into GITLEAKS_SHA256 — both in one
# commit. The checkout action is pinned by commit SHA (tag in trailing comment).

name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (from gitleaks_8.30.1_checksums.txt)
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release, SHA-256 verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" "${url}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/${tarball}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan full git history (redacted, count-only)
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" git \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --no-banner \
            .
